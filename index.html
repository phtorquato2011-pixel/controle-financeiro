<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <!-- Tela de Login -->
    <div id="auth-section" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold mb-4 text-center">Acesse sua Conta</h2>
        <input type="email" id="email" placeholder="E-mail" class="w-full p-2 mb-2 border rounded">
        <input type="password" id="password" placeholder="Senha" class="w-full p-2 mb-4 border rounded">
        <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded mb-2">Entrar</button>
        <button onclick="register()" class="w-full border border-blue-600 text-blue-600 p-2 rounded">Criar Conta (Máx 5)</button>
    </div>

    <!-- Painel Principal (Invisível antes do login) -->
    <div id="app-section" class="hidden max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">Resumo Financeiro</h1>
            <button onclick="logout()" class="text-red-500">Sair</button>
        </header>

        <!-- Cards de Valores -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="card bg-green-500 text-white">
                <p>Saldo Atual</p>
                <h2 id="total-saldo" class="text-3xl font-bold">R$ 0,00</h2>
            </div>
            <div class="card bg-orange-500 text-white">
                <p>Meta de Reserva</p>
                <h2 id="meta-valor" class="text-3xl font-bold">R$ 0,00</h2>
            </div>
        </div>

        <!-- Formulários -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <section class="bg-white p-6 rounded-xl">
                <h3 class="font-bold mb-4 border-b pb-2">Nova Movimentação</h3>
                <input type="text" id="desc" placeholder="Descrição (Ex: Conserto Celular)" class="w-full p-2 mb-2 border rounded">
                <input type="number" id="valor" placeholder="Valor (R$)" class="w-full p-2 mb-2 border rounded">
                <select id="tipo" class="w-full p-2 mb-4 border rounded">
                    <option value="entrada">Ganhei / Tenho</option>
                    <option value="saida">Gastei / Vou Gastar</option>
                </select>
                <button onclick="addMovimentacao()" class="w-full bg-black text-white p-2 rounded">Salvar</button>
            </section>

            <section class="bg-white p-6 rounded-xl">
                <h3 class="font-bold mb-4 border-b pb-2">Objetivos e Notas</h3>
                <textarea id="notas" placeholder="Como quero gastar? O que preciso comprar?" class="w-full p-2 h-24 border rounded mb-2"></textarea>
                <input type="number" id="meta-input" placeholder="Quanto quero juntar?" class="w-full p-2 mb-2 border rounded">
                <button onclick="saveNotes()" class="w-full bg-blue-500 text-white p-2 rounded">Atualizar Objetivos</button>
            </section>
        </div>

        <!-- Histórico -->
        <section class="mt-8 bg-white p-6 rounded-xl shadow">
            <h3 class="font-bold mb-4">Histórico Recente</h3>
            <div id="historico-lista" class="space-y-2">
                <!-- Itens entram aqui via JS -->
            </div>
        </section>
    </div>
